      <text x="405" y="395">120.000 – 200.000</text>
      <text x="625" y="395">150.000 – 200.000</text>
      <text x="845" y="395">250.000 – 300.000</text>
      <text x="1060" y="395">250.000 – 350.000</text>

      <text x="170" y="475" font-weight="700">Lớp 4, 5</text>
