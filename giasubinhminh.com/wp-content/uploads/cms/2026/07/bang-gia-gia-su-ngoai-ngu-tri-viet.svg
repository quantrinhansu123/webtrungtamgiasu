<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Bảng giá gia sư ngoại ngữ Trung Tâm Gia Sư Trí Việt</title>
  <desc id="desc">Bảng học phí tham khảo cho gia sư tiếng Anh, Hàn, Trung, Nhật và Pháp.</desc>
  <rect width="1200" height="800" rx="28" fill="#f5faf7"/>
  <rect width="1200" height="152" rx="28" fill="#087342"/>
  <rect y="124" width="1200" height="28" fill="#087342"/>
  <text x="600" y="68" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">BẢNG GIÁ GIA SƯ NGOẠI NGỮ</text>
  <text x="600" y="116" fill="#ffe38a" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">TRUNG TÂM GIA SƯ TRÍ VIỆT</text>

  <g font-family="Arial, sans-serif" font-size="21" text-anchor="middle">
    <rect x="45" y="188" width="1110" height="72" rx="10" fill="#126b8a"/>
    <text x="190" y="232" fill="#ffffff" font-weight="700">NỘI DUNG HỌC</text>
    <text x="445" y="218" fill="#ffffff" font-weight="700">SINH VIÊN</text>
    <text x="445" y="246" fill="#ffffff" font-size="18">1 học sinh</text>
    <text x="655" y="218" fill="#ffffff" font-weight="700">SINH VIÊN</text>
    <text x="655" y="246" fill="#ffffff" font-size="18">2 học sinh</text>
    <text x="865" y="218" fill="#ffffff" font-weight="700">GIÁO VIÊN</text>
    <text x="865" y="246" fill="#ffffff" font-size="18">1 học sinh</text>
    <text x="1060" y="218" fill="#ffffff" font-weight="700">GIÁO VIÊN</text>
    <text x="1060" y="246" fill="#ffffff" font-size="18">2 học sinh</text>

    <g fill="#ffffff" stroke="#b8d9c8" stroke-width="2">
      <rect x="45" y="272" width="1110" height="70" rx="8"/>
      <rect x="45" y="352" width="1110" height="70" rx="8"/>
      <rect x="45" y="432" width="1110" height="70" rx="8"/>
      <rect x="45" y="512" width="1110" height="70" rx="8"/>
      <rect x="45" y="592" width="1110" height="70" rx="8"/>
    </g>
    <g stroke="#b8d9c8" stroke-width="2">
      <path d="M330 188v474M550 188v474M760 188v474M970 188v474"/>
    </g>

    <g fill="#173a2b">
      <text x="190" y="315" font-weight="700">Tiếng Anh giao tiếp</text>
      <text x="440" y="315">150.000 – 180.000</text>
      <text x="655" y="315">220.000 – 250.000</text>
      <text x="865" y="315">250.000 – 300.000</text>
      <text x="1060" y="315">350.000</text>

      <text x="190" y="395" font-weight="700">Tiếng Anh người đi làm</text>
      <text x="440" y="395">150.000 – 180.000</text>
      <text x="655" y="395">220.000 – 250.000</text>
      <text x="865" y="395">250.000 – 300.000</text>
      <text x="1060" y="395">350.000</text>

      <text x="190" y="475" font-weight="700">TOEIC, TOEFL, B1, B2</text>
      <text x="440" y="475">150.000 – 200.000</text>
      <text x="655" y="475">250.000</text>
      <text x="865" y="475">250.000 – 300.000</text>
      <text x="1060" y="475">Liên hệ</text>

      <text x="190" y="555" font-weight="700">IELTS</text>
      <text x="440" y="555">200.000</text>
      <text x="655" y="555">300.000 – 350.000</text>
      <text x="865" y="555">300.000 – 400.000</text>
      <text x="1060" y="555">Liên hệ</text>

      <text x="190" y="635" font-weight="700">Trung, Nhật, Hàn, Pháp</text>
      <text x="440" y="635">150.000 – 180.000</text>
      <text x="655" y="635">200.000 – 250.000</text>
      <text x="865" y="635">250.000 – 300.000</text>
      <text x="1060" y="635">250.000 – 300.000</text>
