  <text x="600" y="716" fill="#414141" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Mức học phí tham khảo theo buổi và được thống nhất trước khi học.</text>
  <text x="600" y="758" fill="#e33b2e" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">TƯ VẤN: 0962.005.996 • 0987.005.996</text>
